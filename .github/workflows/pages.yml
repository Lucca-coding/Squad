name: Publicar site no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "logo.png"
      - "mark.png"
      - "icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        run: |
          mkdir site
          cp index.html config.js logo.png mark.png site/
          if [ -f icon.png ]; then cp icon.png site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
